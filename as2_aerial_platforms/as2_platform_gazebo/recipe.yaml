package:
  name: "ros-humble-as2-platform-gazebo"
  version: "1.1.3"
source:
  path: ..
build:
  number: 1
  skip: false
  script:
    - cmake -S as2_platform_gazebo -B build -G Ninja -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=$PYTHON -DPython_EXECUTABLE=$PYTHON
    - cmake --build build
    - cmake --install build
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - ninja
  host:
    - ros-humble-ament-cmake-ros
    - ros-humble-ament-lint-auto
    - ros-humble-ament-cmake
    - ros-humble-ament-cmake-python
    - ros-humble-ros-gz-sim
    - ros-humble-ros-gz-bridge
    - ros-humble-rclcpp
    - ros-humble-as2-gazebo-assets
    - ros-humble-as2-core
    - ros-humble-as2-msgs
    - ros-humble-sensor-msgs
    - ros-humble-geometry-msgs
    - ros-humble-tf2-msgs
    - ros-humble-tf2-ros
    - ros-humble-ros-gz-interfaces
    - ros-humble-std-srvs
    - ros-humble-tf2-geometry-msgs
  run:
    - ros-humble-ros-gz-sim
    - ros-humble-ros-gz-bridge
    - ros-humble-rclcpp
    - ros-humble-as2-core
    - ros-humble-as2-msgs
    - ros-humble-sensor-msgs
    - ros-humble-geometry-msgs
    - ros-humble-tf2-msgs
    - ros-humble-tf2-ros
    - ros-humble-ros-gz-interfaces
    - ros-humble-std-srvs
    - ros-humble-tf2-geometry-msgs
tests:
  - script: exit 0
about:
  homepage: "https://github.com/aerostack2/aerostack2"
  summary: "Messages, services and action files for Aerostack2"
  license: "BSD-3-Clause"
