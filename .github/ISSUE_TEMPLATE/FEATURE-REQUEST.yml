name: Feature request
description: Propose a new feature, package or architecture change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        New features need an agreed design before any pull request. Pull requests without one are closed. For an early idea, start an [Ideas discussion](https://github.com/aerostack2/aerostack2/discussions/categories/ideas) instead.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why Aerostack2 doesn't support it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it would work. Name the packages, interfaces, messages or parameters it adds or changes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you considered, including what you can do today without this change.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Breaking changes, effect on the external platform repositories, extra dependencies.
  - type: dropdown
    id: contribute
    attributes:
      label: Will you implement it?
      options:
        - Yes, once the design is agreed
        - I can help
        - No
    validations:
      required: true
