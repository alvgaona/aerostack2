name: Bug report
description: Something in Aerostack2 doesn't work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search [open and closed issues](https://github.com/aerostack2/aerostack2/issues?q=is%3Aissue) first. If an open issue matches, react with 👍 instead of opening a new one. Report one bug per issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The minimal commands, launch files and config needed to see the bug. Link a repository or project if it helps.
      placeholder: |
        1. ros2 launch ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal output. It is formatted as code automatically.
      render: shell
  - type: dropdown
    id: distro
    attributes:
      label: ROS 2 distro
      options:
        - Humble
        - Jazzy
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aerostack2 version
      description: Release, or branch and commit when built from source.
      placeholder: 1.1.3, or main at abc1234
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation
      options:
        - Binaries (apt)
        - Source
        - Docker
        - Pixi
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Aerial platform
      multiple: true
      options:
        - Gazebo
        - Multirotor simulator
        - PX4
        - Crazyflie
        - Tello
        - DJI
        - Other
        - Not platform related
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, simulator version, hardware, anything else that may matter.
      placeholder: Ubuntu 22.04, Gazebo Harmonic
