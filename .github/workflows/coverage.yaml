name: coverage

on:
  schedule:
    - cron: '7 7 * * *'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          pixi-version: v0.83.0
          environments: coverage
          locked: true

      - name: Build
        run: pixi run -e coverage coverage-build

      # Report even when some tests fail: coverage still counts what ran.
      - name: Test
        run: pixi run -e coverage coverage-test

      - name: Report
        if: ${{ !cancelled() }}
        run: pixi run -e coverage coverage-report

      - name: Upload to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.xml
          # Upload only the gcovr report, filtered by gcovr.cfg.
          disable_search: true
          plugins: noop
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
