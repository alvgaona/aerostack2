name: humble

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Selects the packages this change affects (plus their dependents).
  # Pushes to main always select the full workspace.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
      skip: ${{ steps.detect.outputs.skip }}
      full_build: ${{ steps.detect.outputs.full_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        uses: ./.github/actions/changed-packages

  build:
    needs: changes
    if: needs.changes.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:humble-desktop
    env:
      # Must live under github.workspace: the mount shared between the
      # container and the cache action.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Install deps
        run: |
          sudo apt-get update && sudo apt-get install -y ccache python3-vcstool python3-rosdep python3-pip python3-colcon-common-extensions python3-empy ros-humble-behaviortree-cpp
          # Workaround for behaviortree_cpp 4.9.1: its deb installs the library under
          # lib/<multiarch>/, where ament_export_libraries and the LD_LIBRARY_PATH
          # environment hook cannot find it, so find_package(behaviortree_cpp) fails.
          # Fixed upstream in 4.10.0, not yet released for humble.
          # See https://github.com/BehaviorTree/BehaviorTree.CPP/issues/1175
          # No-op once the humble deb ships >= 4.10.0; delete it then.
          sudo find /opt/ros/humble/lib -path '*-linux-gnu/libbehaviortree_cpp.so' \
            -exec ln -sf {} /opt/ros/humble/lib/ \;
      - name: Setup ros
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      # Compiler cache: PRs restore the newest cache from main or any PR
      # (restore-keys prefix match); each run saves under its own SHA.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-humble-${{ github.sha }}
          restore-keys: ccache-humble-
      - name: Configure ccache
        run: ccache --max-size=1.5G && ccache --zero-stats
      - name: build and test
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          extra-cmake-args: >-
            -DCMAKE_C_COMPILER_LAUNCHER=ccache
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          package-name: ${{ needs.changes.outputs.packages }}
          target-ros2-distro: humble
          # Coverage is owned by the nightly codecov_test workflow; PR builds
          # compile at normal optimization and skip lcov entirely.
          colcon-defaults: |
            {
              "test": {
                "parallel-workers" : 1
              }
            }
      - name: ccache stats
        if: always()
        run: ccache --show-stats

  # Single required status check. Green when every needed job succeeded or
  # was skipped on purpose (docs-only changes skip the build).
  ci-passed:
    runs-on: ubuntu-latest
    needs: [changes, build]
    if: always()
    steps:
      - name: Verify results
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
