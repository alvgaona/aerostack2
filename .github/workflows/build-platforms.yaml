name: platforms

# Platform repos consume aerostack2's interfaces; they break when as2_core or
# as2_msgs drift. PRs that can cause that run them; everything else is covered
# nightly.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - 'as2_core/**'
      - 'as2_msgs/**'
      - 'as2_aerial_platforms/**'
      - '.github/workflows/build-platforms.yaml'

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-platforms:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:${{ matrix.distro }}-desktop
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        repos: [
          as2_platform_crazyflie,
          as2_platform_tello,
          as2_platform_dji_osdk,
          as2_platform_pixhawk,
          as2_platform_dji_psdk,
          as2_platform_mavlink
        ]
        exclude:
          # TODO(jazzy): as2_platform_crazyflie, as2_platform_dji_osdk and
          # as2_platform_dji_psdk do not support jazzy yet.
          - { distro: jazzy, repos: as2_platform_crazyflie }
          - { distro: jazzy, repos: as2_platform_dji_osdk }
          - { distro: jazzy, repos: as2_platform_dji_psdk }
    steps:
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y python3-vcstool python3-rosdep python3-pip python3-colcon-common-extensions python3-empy
      - name: Setup ros
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.distro }}
      - name: Checkout Aerostack2 and platforms
        run : |
          set +e
          export PLATFORM=${{ matrix.repos }}
          export REPOS_URL="https://raw.githubusercontent.com/aerostack2/$PLATFORM/main/dependencies.repos"
          export REPOS_PATH=/tmp/dependencies.repos
          wget -S --spider $REPOS_URL  2>&1 | grep 'HTTP/1.1 200 OK'
          if [ $? -eq 0 ]; then wget $REPOS_URL -O $REPOS_PATH; else echo "repositories:" > $REPOS_PATH; fi
          echo "  $PLATFORM:\n    type: git\n    url: https://github.com/aerostack2/$PLATFORM.git\n    version:  main " >> $REPOS_PATH
          cat $REPOS_PATH
      - name: build and test ${{ matrix.repos }}
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          package-name: >
            ${{ matrix.repos }}
          target-ros2-distro: ${{ matrix.distro }}
          vcs-repo-file-url: /tmp/dependencies.repos

  # Nightly failures land in a deduplicated tracking issue instead of a log
  # nobody reads.
  report-nightly-failure:
    runs-on: ubuntu-latest
    needs: build-platforms
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Open or ping tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'ci: nightly platforms build is failing'
        run: |
          issue=$(gh issue list -R ${{ github.repository }} --label ci-nightly --state open --search "$TITLE" --json number --jq '.[0].number')
          body="Nightly platforms run failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" -R ${{ github.repository }} --body "$body"
          else
            gh issue create -R ${{ github.repository }} --title "$TITLE" --label ci-nightly --body "$body"
          fi
