name: pixi

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel in-flight runs when a PR receives a new push; never cancel main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-${{ matrix.env }}-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        env: [humble, jazzy]
        platform: [linux-64, linux-aarch64, osx-arm64]
        include:
          - platform: linux-64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: osx-arm64
            runner: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.77.1
          run-install: false
          cache: true

      - name: Build workspace
        # --locked: fail if pixi.lock is out of date with the manifests
        # instead of silently re-solving against whatever is latest.
        run: pixi install -e ${{ matrix.env }} --locked
