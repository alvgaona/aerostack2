[workspace]
preview = ["pixi-build"]
authors = ["Alvaro Gaona <alvgaona@gmail.com>"]
channels = ["conda-forge"]
name = "aerostack2"
platforms = [
  { platform = "linux-64", glibc = "2.34" },
  { platform = "linux-aarch64", glibc = "2.34" },
  "osx-arm64"
]
version = "1.1.3"

# pin: libcxx 23 removed std::wstring_convert, still used by rosidl_runtime_cpp
# headers. Drop when ROS or conda-forge ships a fix.
[workspace.target.osx-arm64.build-variants]
c_compiler_version = ["22"]
cxx_compiler_version = ["22"]

[dependencies]
aerostack2 = { path = "./aerostack2" }

[feature.jazzy]
channels = ["robostack-jazzy"]

[feature.jazzy.dependencies]
ros-jazzy-ros2cli = ">=0.32.8,<0.33"
ros-jazzy-ros2pkg = ">=0.32.8,<0.33"

[feature.humble]
channels = ["robostack-humble"]

[feature.humble.dependencies]
ros-humble-ros2cli = ">=0.18.17,<0.19"
ros-humble-ros2pkg = ">=0.18.17,<0.19"

[feature.lint]
channels = ["robostack-humble", "conda-forge"]

[feature.lint.dependencies]
commitlint = { version = ">=21.2", channel = "conda-forge" }
lefthook = ">=2.2"
# Humble's apt uncrustify_vendor ships 0.72; newer releases format differently.
uncrustify = { version = "0.72.*", channel = "conda-forge" }
ros-humble-ament-uncrustify = "*"
ros-humble-ament-cpplint = "*"
ros-humble-ament-flake8 = "*"
ros-humble-ament-pep257 = "*"
ros-humble-ament-xmllint = "*"

[feature.lint.tasks]
check-coverage-dev = "python .github/scripts/check_coverage_dev.py"

[feature.coverage]
channels = ["robostack-humble", "conda-forge"]

[feature.coverage.dependencies]
colcon-common-extensions = "*"
gcovr = "*"
ros-humble-ament-cmake-gtest = "*"

# Same clang as the osx-arm64 build-variants pin; llvm-tools must match it.
[feature.coverage.target.osx-arm64.dependencies]
clang_osx-arm64 = "22.*"
clangxx_osx-arm64 = "22.*"
llvm-tools = "22.*"

[feature.coverage.target.linux.dependencies]
cxx-compiler = "*"
c-compiler = "*"

# gcovr reads GCOV: the gcov that matches each platform's compiler.
[feature.coverage.target.osx-arm64.activation.env]
GCOV = "llvm-cov gcov"

[feature.coverage.target.linux-64.activation.env]
GCOV = "x86_64-conda-linux-gnu-gcov"

[feature.coverage.target.linux-aarch64.activation.env]
GCOV = "aarch64-conda-linux-gnu-gcov"

# Install the dependencies of these packages, not the packages themselves,
# so colcon can build them from source with coverage flags. Must list the
# same packages as aerostack2/pixi.toml; lefthook checks that with
# `pixi run -e lint check-coverage-dev`.
[feature.coverage.dev]
as2_alphanumeric_viewer = { path = "./as2_user_interfaces/as2_alphanumeric_viewer" }
as2_behavior = { path = "./as2_behaviors/as2_behavior" }
as2_behavior_tree = { path = "./as2_behavior_tree" }
as2_behaviors_motion = { path = "./as2_behaviors/as2_behaviors_motion" }
as2_behaviors_object_perception = { path = "./as2_behaviors/as2_behaviors_object_perception" }
as2_behaviors_param_estimation = { path = "./as2_behaviors/as2_behaviors_param_estimation" }
as2_behaviors_path_planning = { path = "./as2_behaviors/as2_behaviors_path_planning" }
as2_behaviors_payload = { path = "./as2_behaviors/as2_behaviors_payload" }
as2_behaviors_platform = { path = "./as2_behaviors/as2_behaviors_platform" }
as2_behaviors_swarm_flocking = { path = "./as2_behaviors/as2_behaviors_swarm_flocking" }
as2_behaviors_trajectory_generation = { path = "./as2_behaviors/as2_behaviors_trajectory_generation" }
as2_cli = { path = "./as2_cli" }
as2_core = { path = "./as2_core" }
as2_external_object_to_tf = { path = "./as2_utilities/as2_external_object_to_tf" }
as2_gazebo_assets = { path = "./as2_simulation_assets/as2_gazebo_assets" }
as2_geozones = { path = "./as2_utilities/as2_geozones" }
as2_keyboard_teleoperation = { path = "./as2_user_interfaces/as2_keyboard_teleoperation" }
as2_map_server = { path = "./as2_map_server" }
as2_motion_controller = { path = "./as2_motion_controller" }
as2_motion_reference_handlers = { path = "./as2_motion_reference_handlers" }
as2_msgs = { path = "./as2_msgs" }
as2_platform_gazebo = { path = "./as2_aerial_platforms/as2_platform_gazebo" }
as2_platform_multirotor_simulator = { path = "./as2_aerial_platforms/as2_platform_multirotor_simulator" }
as2_python_api = { path = "./as2_python_api" }
as2_realsense_interface = { path = "./as2_hardware_drivers/as2_realsense_interface" }
as2_rviz_plugins = { path = "./as2_user_interfaces/as2_visualization/as2_rviz_plugins" }
as2_state_estimator = { path = "./as2_state_estimator" }
as2_usb_camera_interface = { path = "./as2_hardware_drivers/as2_usb_camera_interface" }
as2_visualization = { path = "./as2_user_interfaces/as2_visualization/as2_visualization" }

# Usage: pixi run -e coverage coverage [package]
# Without a package, covers the whole workspace. Report: coverage/[package]/index.html
# Filters for the report are in gcovr.cfg.
[feature.coverage.tasks.coverage-build]
args = [{ arg = "pkg", default = "" }]
cmd = """colcon build {% if pkg %}--packages-up-to {{ pkg }}{% else %}--continue-on-error{% endif %} \
  --cmake-args -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS=--coverage -DCMAKE_CXX_FLAGS=--coverage \
  -DBUILD_TESTING=ON"""

# Linters are skipped: they don't execute code, and `pixi run lint` covers them.
[feature.coverage.tasks.coverage-test]
args = [{ arg = "pkg", default = "" }]
cmd = """find build/{{ pkg }} -name '*.gcda' -delete;
  colcon test {% if pkg %}--packages-select {{ pkg }}{% endif %} \
  --ctest-args -E 'uncrustify|cpplint|flake8|pep257|xmllint|lint_cmake|copyright|cppcheck';
  colcon test-result --test-result-base build/{{ pkg }}"""

[feature.coverage.tasks.coverage-report]
args = [{ arg = "pkg", default = "" }]
cmd = """mkdir -p coverage/{{ pkg }} && gcovr --object-directory build/{{ pkg }} \
  {% if pkg %}--filter "$(colcon list --packages-select {{ pkg }} --paths-only)/"{% endif %} \
  --html-details coverage/{{ pkg }}/index.html --cobertura coverage/{{ pkg }}/coverage.xml \
  --print-summary"""

[feature.coverage.tasks.coverage]
args = [{ arg = "pkg", default = "" }]
depends-on = [
  { task = "coverage-build", args = ["{{ pkg }}"] },
  { task = "coverage-test", args = ["{{ pkg }}"] },
  { task = "coverage-report", args = ["{{ pkg }}"] },
]

[environments]
default = ["humble"]
jazzy = ["jazzy"]
lint = { features = ["lint"], no-default-feature = true }
coverage = { features = ["humble", "coverage"], no-default-feature = true }
