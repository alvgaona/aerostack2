package:
  name: "ros-humble-as2-cli"
  version: "1.1.3"

source:
  path: ..
  filter:
    include:
      - "as2_cli/**"
build:
  number: 1
  skip: false
  script:
    - cmake -S as2_cli -B build -G Ninja -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
    - cmake --install build
requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - make
    - ninja
    - colcon-common-extensions
    - ros-humble-ament-cmake
  host:
    - ros-humble-ament-cmake
about:
  homepage: "https://github.com/aerostack2/aerostack2"
  summary: "Aerostack2 CLI package"
  license: "BSD-3-Clause"
