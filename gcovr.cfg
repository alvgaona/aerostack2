# Coverage report filters, read by gcovr from the repo root.
# Run it through pixi: `pixi run -e coverage coverage-report`.
root = .

# Only our sources: not tests, generated or vendored code, or the pixi env.
exclude = \.pixi/
exclude = build/
exclude = install/
exclude = .*/tests?/
exclude = .*/thirdparty/
exclude = .*/ekf_c_code\.

exclude-throw-branches = yes

# CMakeFiles/<version>/ holds CMake's compiler probes, also built with --coverage.
gcov-exclude-directories = .*/CMakeFiles/[0-9.]+/.*
gcov-ignore-errors = no_working_dir_found
gcov-ignore-parse-errors = negative_hits.warn_once_per_file
