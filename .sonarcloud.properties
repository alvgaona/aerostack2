# SonarQube Cloud Automatic Analysis settings.
# Organization and project key are set in the dashboard, not here.

sonar.sourceEncoding=UTF-8

# Humble (Ubuntu 22.04) ships 3.10, Jazzy (Ubuntu 24.04) ships 3.12.
sonar.python.version=3.10, 3.11, 3.12

# C/C++: every package builds with CMAKE_CXX_STANDARD 17.
sonar.cfamily.reportingCppStandardOverride=c++17
sonar.cfamily.customTargetArch=x86_64
sonar.cfamily.customTargetVendor=pc
sonar.cfamily.customTargetSystem=linux
sonar.cfamily.customTargetEnv=gnu

# Generated (CasADi) and vendored code.
sonar.exclusions=\
  as2_state_estimator/plugins/simple_ekf/lib/ekf/src/ekf_c_code.cpp,\
  as2_state_estimator/plugins/simple_ekf/lib/ekf/include/ekf/ekf_c_code.h,\
  as2_behaviors/as2_behaviors_path_planning/plugins/voronoi/thirdparty/**

# Mark test code so issues and coverage treat it as tests.
# The C/C++ analyzer ignores sonar.tests, so this only affects Python.
sonar.test.inclusions=**/tests/**,**/test/**

# Launch files are duplicated on purpose.
sonar.cpd.exclusions=**/launch/**
